<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air pen</title>
<script>
/* =====================================================================
   AIR PEN: pinch to draw, wave to erase. A transparent OBS overlay.
   ===================================================================== */
const CONFIG = {
  cameraName: "NDI Webcam",           // part of the camera's name is enough
  mirror: false,                      // true if you flipped your camera horizontally in OBS
  camRect: { x: 0, y: 0, w: 1920, h: 1080 },   // where your camera sits on the 1920x1080 canvas

  // each new line (thumb + index pinch) gets a random color from this list, never the same twice in a row
  inkColors: ["#56E2E1", "#DF41CF", "#FFCE00", "#C1BFFF", "#B3F2F1", "#EFA0E7", "#FFE67F"],   // GACA accents + tints
  inkWidth: 7,                        // line thickness at 1080p
  inkGlow: 1.0,                       // 0 = flat ink, 1 = soft neon glow
  penCursor: true,                    // small ring at your fingertip so you can aim
  pinchStart: 0.30,                   // how close thumb and index must be to START a line (lower = tighter pinch)
                                      // the line keeps going until your hand is clearly open
  waveErase: 3                        // back-and-forth swings needed to erase (within ~1 second)
};
const FORCE_DEMO = false;
</script>
<style>
  :root { color-scheme: light; --bg: #EDECF6; --bg2: #FFFFFF; --panel: rgba(255,255,255,.9); --text: #0D004D; --muted: #4A4377; --line: rgba(13,0,77,.12); box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #06001F; --bg2: #1E1150; --panel: rgba(13,0,77,.9); --text: #FFFFFF; --muted: #C1BFFF; --line: rgba(255,255,255,.14); } }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #06001F; --bg2: #1E1150; --panel: rgba(13,0,77,.9); --text: #FFFFFF; --muted: #C1BFFF; --line: rgba(255,255,255,.14); }
  *, *::before, *::after { box-sizing: inherit; }
  #ui { display: none; }
  body.demo { background: radial-gradient(ellipse at 50% 35%, var(--bg2), var(--bg) 72%); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body.demo #ui { display: block; }
  body.demo #pen { inset: 0; width: 100%; height: 100%; pointer-events: auto; touch-action: none; cursor: crosshair; }
  #ui header { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; }
  #ui h1 { margin: 0; font-size: 19px; font-weight: 700; }
  #ui p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  #ui .bar { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 420px; margin: 0 auto; display: flex; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
  #ui button { flex: 1; font: inherit; font-size: 15px; font-weight: 600; padding: 11px; border-radius: 10px; border: 0; background: #FFCE00; color: #0D004D; cursor: pointer; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #pen { position: absolute; display: block; pointer-events: none; background: transparent; }
  #video { position: absolute; left: -10px; top: -10px; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #status { position: absolute; left: 20px; top: 20px; font: 600 22px system-ui, sans-serif; color: #fff;
    background: rgba(0,0,0,.6); padding: 10px 16px; border-radius: 8px; display: none; max-width: 900px; }
  body.debug #status { display: block; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="pen"></canvas>
<div id="status">Starting…</div>
<div id="ui">
  <header><h1>Air pen</h1><p>Press and drag to draw (that’s your pinch). Each new line gets a new GACA color.</p></header>
  <div class="bar"><button id="bErase">Wave to erase ✨</button></div>
</div>
<script>
(() => {
const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug'), DEMO = FORCE_DEMO || params.has('demo');
if (DEBUG) document.body.classList.add('debug');
const statusEl = document.getElementById('status');
const setStatus = s => { statusEl.textContent = s; console.log('[pen]', s); };
const video = document.getElementById('video');

const penCv = document.getElementById('pen'), pctx = penCv.getContext('2d');
const inkCv = document.createElement('canvas'), ictx = inkCv.getContext('2d');      // ink is drawn once, kept here
const fadeCv = document.createElement('canvas'), fctx = fadeCv.getContext('2d');   // copy that dissolves on erase
const glowCv = document.createElement('canvas'), gctx = glowCv.getContext('2d');   // blurred copy of the ink = soft neon glow
let glowDirty = true;
const pen = { on: true, wave: { ext: null, dir: 0, flips: [] }, hands: {}, strokes: [], fadeT: -1, sparks: [], lastErase: -1e9, W: 1, H: 1, s: 1 };
function penResize(W, H) {
  for (const c of [penCv, inkCv, fadeCv, glowCv]) { c.width = W; c.height = H; }
  pen.W = W; pen.H = H; pen.s = H / 1080; redrawInk();
}
function strokeStyle(ctx, col, w, glow) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.shadowBlur = 0;
}
const coreCache = {};
function coreOf(col) {                       // an opaque, lighter shade for the bright center (no beading at joints)
  if (coreCache[col]) return coreCache[col];
  const n = parseInt(col.slice(1), 16), mix = v => Math.round(v + (255 - v) * .55);
  return coreCache[col] = `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
}
function drawSeg(ctx, a, b, c, col) {        // smooth segment through midpoints, with a bright core
  const w = CONFIG.inkWidth * pen.s;
  const m1 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, m2 = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2 };
  glowDirty = true;
  strokeStyle(ctx, col, w, false); ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.quadraticCurveTo(b.x, b.y, m2.x, m2.y); ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = coreOf(col); ctx.lineWidth = w * .32;
  ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.quadraticCurveTo(b.x, b.y, m2.x, m2.y); ctx.stroke();
}
function redrawInk() {
  ictx.clearRect(0, 0, pen.W, pen.H);
  for (const s of pen.strokes) for (let i = 0; i < s.pts.length; i++) {
    const a = s.pts[Math.max(0, i - 2)], b = s.pts[Math.max(0, i - 1)], c = s.pts[i]; drawSeg(ictx, a, b, c, s.col);
  }
}
function addPoint(st, p) {
  const n = st.pts.length, last = st.pts[n - 1];
  if (last && Math.hypot(p.x - last.x, p.y - last.y) < 1.5 * pen.s) return;
  st.pts.push(p); const k = st.pts.length;
  drawSeg(ictx, st.pts[Math.max(0, k - 3)], st.pts[Math.max(0, k - 2)], st.pts[k - 1], st.col);
}
const inkFadeSrc = document.createElement('canvas');
function eraseInk(now) {
  inkFadeSrc.width = pen.W; inkFadeSrc.height = pen.H;
  if (!pen.strokes.length || now - pen.lastErase < 1200) return;
  pen.lastErase = now;
  fctx.clearRect(0, 0, pen.W, pen.H); fctx.drawImage(inkCv, 0, 0); inkFadeSrc.getContext('2d').clearRect(0, 0, pen.W, pen.H); inkFadeSrc.getContext('2d').drawImage(inkCv, 0, 0); pen.fadeT = 0;
  for (const s of pen.strokes) for (let i = 0; i < s.pts.length; i += 3)            // sparkles lift off the ink
    if (pen.sparks.length < 900) pen.sparks.push({ x: s.pts[i].x, y: s.pts[i].y, vx: (Math.random() - .5) * 90 * pen.s, vy: (-40 - Math.random() * 120) * pen.s, age: 0, life: .5 + Math.random() * .6, col: s.col });
  pen.strokes = []; ictx.clearRect(0, 0, pen.W, pen.H); glowDirty = true;
  fctx.save(); fctx.globalCompositeOperation = 'destination-over'; fctx.filter = `blur(${Math.max(1, 9 * pen.s)}px)`; fctx.drawImage(inkFadeSrc, 0, 0); fctx.restore();
  for (const k in pen.hands) pen.hands[k].stroke = null;
}
const FINGERS = [8];                       // thumb + index only: the most reliable pinch
// colors in the same family (a color and its tint) count as "the same", so each new line clearly changes
const FAMILY = { '#56E2E1': 't', '#B3F2F1': 't', '#DF41CF': 'f', '#EFA0E7': 'f', '#FFCE00': 'a', '#FFE67F': 'a', '#C1BFFF': 'p', '#EDECF6': 'p' };
let lastFam = null;
function nextInk() {
  const fam = c => FAMILY[c.toUpperCase()] || c;
  let pool = CONFIG.inkColors.filter(c => fam(c) !== lastFam); if (!pool.length) pool = CONFIG.inkColors;
  const c = pool[Math.floor(Math.random() * pool.length)]; lastFam = fam(c); return c;
}
// One-euro filter: removes jitter when you move slowly, stays responsive when you move fast
function oneEuro(minCut, beta) {
  let x = null, dx = 0, t0 = 0; const alpha = (cut, dt) => { const r = 2 * Math.PI * cut * dt; return r / (r + 1); };
  return (v, t) => {
    if (x === null) { x = v; t0 = t; return v; }
    const dt = Math.max(1e-3, (t - t0) / 1000); t0 = t;
    const d = (v - x) / dt; dx += alpha(1, dt) * (d - dx);
    x += alpha(minCut + beta * Math.abs(dx), dt) * (v - x); return x;
  };
}
function penUpdate(res, now) {
  if (!pen.on) return;
  const seen = {};
  const lms = (res && res.landmarks) || [], hs = (res && res.handednesses) || [];
  lms.forEach((lm, i) => {
    const key = (hs[i] && hs[i][0] && hs[i][0].categoryName) || ('h' + i); seen[key] = true;
    const H = pen.hands[key] || (pen.hands[key] = { stroke: null, drawing: false, pinchN: 0, openN: 0, p: null, fx: null, fy: null, ext: null, dir: 0, flips: [], lastSeen: 0 });
    H.lastSeen = now;
    const P = j => ({ x: lm[j].x * pen.W, y: lm[j].y * pen.H });
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const wrist = P(0), scale = dist(wrist, P(9)) || 1;
    const pinch = dist(P(4), P(8)) / scale;
    // how many fingers are clearly straight (tip well beyond its middle knuckle)
    const extended = [[8, 6], [12, 10], [16, 14], [20, 18]].filter(([t, k]) => dist(wrist, P(t)) > dist(wrist, P(k)) * 1.22).length;
    const isPinch = pinch < CONFIG.pinchStart;
    const isOpen = extended >= 3 && pinch > CONFIG.pinchStart * 2;
    // smoothed pen tip = your index fingertip
    if (!H.fx) { H.fx = oneEuro(.9, .012 / pen.s); H.fy = oneEuro(.9, .012 / pen.s); }
    const tip = P(8), p = { x: H.fx(tip.x, now), y: H.fy(tip.y, now) }; H.p = p;
    if (!H.drawing) {
      H.pinchN = isPinch ? H.pinchN + 1 : 0;
      if (H.pinchN >= 3) {                                        // pinch held ~0.1s: start a new line
        H.drawing = true; H.openN = 0; H.stroke = { col: nextInk(), pts: [] }; pen.strokes.push(H.stroke); addPoint(H.stroke, p);
      }
    } else {
      // while the hand looks like it's opening, hold the ink still (no hook at the end of the line);
      // if it was just a flicker, drawing resumes from where you are
      if (!isOpen) addPoint(H.stroke, p);
      H.openN = isOpen ? H.openN + 1 : 0;
      if (H.openN >= 4) { H.drawing = false; H.stroke = null; H.pinchN = 0; }   // hand clearly open for ~0.13s: stop
    }
    // wave to erase: watch the FINGERTIPS swing (the wrist barely moves in a real wave).
    // One shared counter, so the tracker swapping 'left'/'right' labels mid-wave doesn't matter.
    if (i === 0) {
      const W = pen.wave;
      if (H.drawing) { W.flips = []; W.ext = null; W.dir = 0; }
      else {
        const tx = (P(8).x + P(12).x + P(16).x) / 3, need = scale * .45;      // a swing bigger than ~half your palm
        if (W.ext === null) W.ext = tx;
        const d = tx - W.ext, dir = Math.sign(d);
        if (Math.abs(d) > need) { if (W.dir && dir !== W.dir) W.flips.push(now); W.dir = dir; W.ext = tx; }
        else if (dir === W.dir) W.ext = W.dir > 0 ? Math.max(W.ext, tx) : Math.min(W.ext, tx);
        else if (!W.dir && Math.abs(d) > need * .5) W.dir = dir;
        W.flips = W.flips.filter(t => now - t < 1300);
        if (W.flips.length >= CONFIG.waveErase) { W.flips = []; eraseInk(now); }
      }
    }
  });
  for (const k in pen.hands) if (!seen[k]) {                     // hand left the frame: end its line after a moment
    const H = pen.hands[k];
    if (now - H.lastSeen > 400) { H.drawing = false; H.stroke = null; H.pinchN = 0; H.p = null; H.fx = H.fy = null; }
  }
}
function penRender(dt) {
  if (!pen.on) return;
  pctx.clearRect(0, 0, pen.W, pen.H);
  if (CONFIG.inkGlow > 0) {
    if (glowDirty) { gctx.clearRect(0, 0, pen.W, pen.H); gctx.filter = `blur(${Math.max(1, 9 * pen.s)}px)`; gctx.drawImage(inkCv, 0, 0); gctx.filter = 'none'; glowDirty = false; }
    pctx.globalAlpha = Math.min(1, CONFIG.inkGlow); pctx.drawImage(glowCv, 0, 0); pctx.drawImage(glowCv, 0, 0); pctx.globalAlpha = 1;
  }
  pctx.drawImage(inkCv, 0, 0);
  if (pen.fadeT >= 0) {                      // erased ink dissolves upward
    pen.fadeT += dt; const k = pen.fadeT / .55;
    if (k >= 1) pen.fadeT = -1;
    else { pctx.save(); pctx.globalAlpha = (1 - k) * (1 - k); pctx.drawImage(fadeCv, 0, -k * 14 * pen.s); pctx.restore(); }
  }
  for (const s of pen.sparks) { s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 60 * pen.s * dt; }
  pen.sparks = pen.sparks.filter(s => s.age < s.life);
  for (const s of pen.sparks) { const k = 1 - s.age / s.life; pctx.globalAlpha = k; pctx.fillStyle = s.col; pctx.shadowColor = s.col; pctx.shadowBlur = 8 * pen.s;
    pctx.beginPath(); pctx.arc(s.x, s.y, (1.5 + 2.5 * k) * pen.s, 0, 7); pctx.fill(); }
  pctx.globalAlpha = 1; pctx.shadowBlur = 0;
  if (CONFIG.penCursor) for (const k in pen.hands) {        // aiming ring at your fingertip
    const H = pen.hands[k]; if (!H.p || performance.now() - H.lastSeen > 250) continue;
    const col = H.drawing && H.stroke ? H.stroke.col : 'rgba(255,255,255,.8)';
    pctx.strokeStyle = col; pctx.fillStyle = col; pctx.lineWidth = 2 * pen.s;
    pctx.beginPath(); pctx.arc(H.p.x, H.p.y, (H.drawing ? 5 : 9) * pen.s, 0, 7); H.drawing ? pctx.fill() : pctx.stroke();
  }
}


/* ---------- camera + hand tracker ---------- */
// Open the camera to track. Goes straight for the named camera (OBS Virtual Camera) and never
// grabs a webcam OBS is already using; if names aren't visible yet, tries cameras one by one.
async function openTrackingCamera() {
  const want = CONFIG.cameraName.toLowerCase();
  const open = id => navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: id }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  const list = async () => (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  let devs = await list();
  const named = devs.find(d => d.label && d.label.toLowerCase().includes(want));
  if (named) return open(named.deviceId);
  // names hidden until a camera has been opened once: try each camera, preferring ones that aren't busy
  let first = null, lastErr = null;
  for (const d of devs) {
    try { first = await open(d.deviceId); break; } catch (e) { lastErr = e; }
  }
  if (!first) throw lastErr || new Error('No camera available');
  devs = await list();
  const match = devs.find(d => d.label && d.label.toLowerCase().includes(want));
  const cur = first.getVideoTracks()[0].getSettings().deviceId;
  if (match && match.deviceId !== cur) {
    first.getTracks().forEach(t => t.stop());
    return open(match.deviceId);
  }
  if (!match) console.warn('[hat] "' + CONFIG.cameraName + '" not found; using', first.getVideoTracks()[0].label, 'from', devs.map(d => d.label));
  return first;
}

let handLm = null, lastVideoTime = -1;
async function start() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('Camera access is blocked. Load this page from an https:// link, and start OBS with --enable-media-stream --use-fake-ui-for-media-stream.');
    setStatus('Opening camera…');
    const stream = await openTrackingCamera();
    video.srcObject = stream; await video.play();
    setStatus('Loading hand tracker…');
    const { HandLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const hopts = dlg => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: dlg },
      runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: .6, minHandPresenceConfidence: .5, minTrackingConfidence: .5 });
    try { handLm = await HandLandmarker.createFromOptions(files, hopts('GPU')); } catch (e) { handLm = await HandLandmarker.createFromOptions(files, hopts('CPU')); }
    setStatus('Drawing ready: ' + (stream.getVideoTracks()[0].label || 'camera'));
  } catch (e) { setStatus('Air pen unavailable: ' + (e.message || e)); }
}

/* ---------- layout + loop ---------- */
function layout() {
  const R = CONFIG.camRect, sx = innerWidth / 1920, sy = innerHeight / 1080;
  Object.assign(penCv.style, { left: R.x * sx + 'px', top: R.y * sy + 'px', width: R.w * sx + 'px', height: R.h * sy + 'px', transform: CONFIG.mirror ? 'scaleX(-1)' : 'none' });
  penResize(Math.round(R.w), Math.round(R.h));
}
addEventListener('resize', layout); layout();
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = Math.max(last, now);
  if (handLm && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    try { penUpdate(handLm.detectForVideo(video, now), now); } catch (e) {}
    if (DEBUG) { const n = Object.values(pen.hands).filter(H => now - H.lastSeen < 250).length; setStatus('Hands: ' + n + ' · strokes: ' + pen.strokes.length + ' · wave ' + pen.wave.flips.length + '/' + CONFIG.waveErase); }
  }
  penRender(dt);
  requestAnimationFrame(frame);
}
window.__pen = { update: penUpdate, pen, render: penRender };
if (DEMO) {
  document.body.classList.add('demo');
  const resizeDemo = () => { const d = Math.min(2, devicePixelRatio || 1); penResize(Math.round(innerWidth * d), Math.round(innerHeight * d)); };
  removeEventListener('resize', layout); addEventListener('resize', resizeDemo); resizeDemo();
  const pt = e => { const r = penCv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * pen.W, y: (e.clientY - r.top) / r.height * pen.H }; };
  let st = null;
  penCv.addEventListener('pointerdown', e => { penCv.setPointerCapture(e.pointerId); st = { col: nextInk(), pts: [] }; pen.strokes.push(st); addPoint(st, pt(e)); });
  penCv.addEventListener('pointermove', e => { if (st) addPoint(st, pt(e)); });
  const end = () => { st = null; }; penCv.addEventListener('pointerup', end); penCv.addEventListener('pointercancel', end);
  document.getElementById('bErase').onclick = () => eraseInk(performance.now() + 2000);
} else if (!params.has('notrack')) start();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
