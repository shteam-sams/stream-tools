<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wizard hat</title>
<script>
/* =====================================================================
   CONFIG: edit these
   ===================================================================== */
const CONFIG = {
  // ---- face tracking (OBS overlay) ----
  cameraName: "OBS Virtual Camera",   // part of the camera's name is enough
  mirror: false,                      // true if you flipped your camera horizontally in OBS
  camRect: { x: 0, y: 0, w: 1920, h: 1080 },   // where your camera sits on the 1920x1080 canvas
  smoothing: 0.1,                    // 0..0.9, higher = steadier but laggier
  sitHeight: -4,                       // nudge the hat up (+) or down (-), in cm
  sitDepth: 3,                        // nudge the hat back (-) or forward (+), in cm
  fitSize: 1.0,                       // fine-tune the auto size (1 = matched to your face)
  hideBrimBehindHead: false,          // true = an invisible head shape hides the brim behind your head (can cut the hat if the fit is off)

  // ---- look (GACA palette) ----
  hatColor: "#512EAB",                // Amethyst
  bandColor: "#56E2E1",               // Turquoise
  patchColors: ["#FFCE00", "#DF41CF", "#56E2E1", "#C1BFFF"],   // Amber, Fuchsia, Turquoise, Light Purple
  hatScale: 1.0,
  hatHeight: 1.0,
  droop: 1.0,                         // how far the tip bends over (0 = straight up)
  droopSide: -1,                      // -1 = tip falls to the hat's left, 1 = right
  charm: true,                        // little brass star hanging from the tip
  sparkles: true,                     // a few drifting sparkles

  // ---- on / off ----
  startOn: true,                      // hat appears (in a puff of smoke) as soon as it finds your face
  blinkToggle: 3,                     // blink this many times quickly to poof the hat on/off (0 = off)
  blinkWindow: 1.3,                   // ...within this many seconds

  // ---- physics ----
  floppiness: 0.8,
  weight: 1.0,                        // heavier = slower and calmer
  gravity: 1.0
};
const FORCE_DEMO = false;
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
  :root { color-scheme: light;
    --bg: #EDECF6; --bg2: #FFFFFF; --panel: rgba(255,255,255,.9); --text: #0D004D; --muted: #4A4377;
    --accent: #512EAB; --line: rgba(13,0,77,.12); --chip: rgba(13,0,77,.06); box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
    --bg: #06001F; --bg2: #1E1150; --panel: rgba(13,0,77,.9); --text: #FFFFFF; --muted: #C1BFFF;
    --accent: #DF41CF; --line: rgba(255,255,255,.14); --chip: rgba(255,255,255,.08); } }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #06001F; --bg2: #1E1150; --panel: rgba(13,0,77,.9); --text: #FFFFFF; --muted: #C1BFFF;
    --accent: #DF41CF; --line: rgba(255,255,255,.14); --chip: rgba(255,255,255,.08); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #gl { position: absolute; display: block; }
  #video { position: absolute; left: -10px; top: -10px; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #gl { background: transparent !important; }
  #status { position: absolute; left: 20px; top: 20px; font: 600 22px system-ui, sans-serif; color: #fff;
    background: rgba(0,0,0,.6); padding: 10px 16px; border-radius: 8px; display: none; max-width: 900px; }
  body.debug #status { display: block; }

  body.demo { background: radial-gradient(ellipse at 50% 38%, var(--bg2), var(--bg) 70%); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body.demo #gl { inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #ui { display: none; } body.demo #ui { display: block; }
  #ui header { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; }
  #ui h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  #ui header p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

  #panel { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: 520px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  @media (min-width: 760px) { #panel { left: auto; right: 20px; bottom: 20px; width: 360px; margin: 0; } }
  .btns { display: flex; gap: 8px; }

    border: 1px solid var(--line); background: var(--chip); color: var(--text); cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: transparent; }
  button.act { background: #FFCE00; color: #0D004D; border-color: transparent; }
  #more { display: none; margin-top: 10px; } #panel.open #more { display: block; }

</style>

<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<div id="status">Starting…</div>

<div id="ui">
  <div id="loading">Stitching the hat…</div>
  <header>
    <h1>Wizard hat</h1>
    <p>Drag the head around. Tap Poof to make the hat vanish and reappear.</p>
  </header>
  <div id="panel">
    <div class="btns">
      <button class="act" id="bShake">Shake</button>
      <button class="act" id="bNod">Nod</button>
      <button class="act" id="bLook">Look</button>
      <button class="act" id="bPoof">Poof</button>
      <button id="bMore" aria-expanded="false">Adjust</button>
    </div>
    <div id="more">
      <div class="swatches"><span>Hat color</span>
        <button class="sw on" data-c="#512EAB" style="background:#512EAB" aria-label="Amethyst"></button>
        <button class="sw" data-c="#0D004D" style="background:#0D004D" aria-label="Pearson Purple"></button>
        <button class="sw" data-c="#DF41CF" style="background:#DF41CF" aria-label="Fuchsia"></button>
        <button class="sw" data-c="#56E2E1" style="background:#56E2E1" aria-label="Turquoise"></button>
        <button class="sw" data-c="#C1BFFF" style="background:#C1BFFF" aria-label="Light Purple"></button>
      </div>
      <div class="row"><label for="sView">Camera angle</label><input id="sView" type="range" min="-80" max="80" step="1" value="0"></div>
      <div class="row"><label for="sFlop">Floppiness</label><input id="sFlop" type="range" min="0.2" max="3" step="0.05" value="0.8"></div>
      <div class="row"><label for="sDroop">Droop</label><input id="sDroop" type="range" min="0" max="2.2" step="0.05" value="1"></div>
      <div class="row"><label for="sHeight">Height</label><input id="sHeight" type="range" min="0.6" max="1.6" step="0.05" value="1"></div>
      <div class="row"><label for="sWeight">Weight</label><input id="sWeight" type="range" min="0.3" max="2.5" step="0.05" value="1"></div>
      <div class="btns toggles">
        <button id="bCharm" class="on">Charm</button>
        <button id="bSpark" class="on">Sparkles</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const params = new URLSearchParams(location.search);
const DEMO = FORCE_DEMO || params.has('demo');
const DEBUG = params.has('debug');
if (DEMO) document.body.classList.add('demo');
if (DEBUG) document.body.classList.add('debug');
const statusEl = document.getElementById('status');
const setStatus = s => { statusEl.textContent = s; console.log('[hat]', s); };
const T = THREE, v3 = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const canvas = document.getElementById('gl'), video = document.getElementById('video');

/* =====================================================================
   RENDERER + STUDIO LIGHTING
   ===================================================================== */
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.VSMShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(DEMO ? 30 : 63, 16 / 9, 1, 10000);

// neutral softbox environment, so metals read as true brass and leather picks up soft highlights
(function makeEnv() {
  const s = new T.Scene(), box = new T.BoxGeometry(1, 1, 1);
  const panel = (hex, k, p, sc) => { const m = new T.Mesh(box, new T.MeshBasicMaterial({ color: new T.Color(hex).multiplyScalar(k) }));
    m.position.set(...p); m.scale.set(...sc); s.add(m); };
  s.background = new T.Color('#3a3850');
  panel('#ffffff', 9, [-5, 4, 5], [4, 4, .2]);      // big key softbox
  panel('#ffffff', 3, [6, 2, 3], [.2, 5, 5]);       // fill card
  panel('#ffffff', 5, [0, 9, 0], [8, .2, 8]);       // ceiling
  panel('#C1BFFF', 2, [0, 2, -8], [10, 4, .2]);     // light purple back wall
  panel('#2a2440', 1, [0, -6, 0], [20, .2, 20]);    // dark floor
  const pm = new T.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, .02).texture;
})();
const hemi = new T.HemisphereLight('#EDECF6', '#1a1440', .28); scene.add(hemi);
const key = new T.DirectionalLight('#fff4e8', 2.1); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 7; key.shadow.blurSamples = 16; key.shadow.bias = -.0006;
Object.assign(key.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 300 });
scene.add(key, key.target);
const fill = new T.DirectionalLight('#C1BFFF', .55); scene.add(fill, fill.target);          // Light Purple fill
const rimA = new T.DirectionalLight('#56E2E1', 1.0); scene.add(rimA, rimA.target);         // Turquoise rim
const rimB = new T.DirectionalLight('#DF41CF', .7); scene.add(rimB, rimB.target);          // Fuchsia rim

/* =====================================================================
   TEXTURES: quiet, physically plausible detail
   ===================================================================== */
const PERM = new Uint16Array(4096), VALS = new Float32Array(4096);
{ let sd = 9876; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 4096; i++) { PERM[i] = r() * 4096 | 0; VALS[i] = r(); } }
const hash = (i, j, s) => VALS[(PERM[(i + s * 131) & 4095] + j * 61 + s * 17) & 4095];
function vnoise(x, y, px, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, w = k => ((k % px) + px) % px;
  const a = hash(w(xi), yi, s), b = hash(w(xi + 1), yi, s), c = hash(w(xi), yi + 1, s), d = hash(w(xi + 1), yi + 1, s);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, px, s, oct) { let t = 0, a = .5, f = 1, n = 0; for (let o = 0; o < oct; o++) { t += vnoise(x * f, y * f, px * f, s + o * 7) * a; n += a; a *= .5; f *= 2; } return t / n; }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function canvasTex(cv, srgb) { const t = new T.CanvasTexture(cv); if (srgb) t.encoding = T.sRGBEncoding; t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = 8; return t; }
function heightToNormal(h, W, H, k) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = h[y * W + (x - 1 + W) % W], r = h[y * W + (x + 1) % W];
    const u = h[((y - 1 + H) % H) * W + x], dn = h[((y + 1) % H) * W + x];
    let nx = (l - r) * k, ny = (dn - u) * k; const nz = 1, L = Math.hypot(nx, ny, nz);
    d[i * 4] = (nx / L * .5 + .5) * 255; d[i * 4 + 1] = (ny / L * .5 + .5) * 255; d[i * 4 + 2] = (nz / L * .5 + .5) * 255; d[i * 4 + 3] = 255;
  }
  c.putImageData(img, 0, 0); return cv;
}
function starPath(c, x, y, R, rot, n = 5, inner = .42) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? R * inner : R, a = rot + i * Math.PI / n - Math.PI / 2; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  c.closePath();
}
function starShape(R, r) {
  const s = new T.Shape();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r : R, a = i * Math.PI / 5 + Math.PI / 2; i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  s.closePath(); return s;
}

// The leather: soft mottling + fine grain. Patches: a few sewn-on felt stars and a moon.
const LW = 768;
const coneGrain = new Float32Array(LW * LW), coneMottle = new Float32Array(LW * LW);
for (let y = 0; y < LW; y++) for (let x = 0; x < LW; x++) {
  const u = x / LW, v = y / LW, i = y * LW + x;
  coneGrain[i] = fbm(u * 110, v * 110, 110, 3, 3);
  coneMottle[i] = fbm(u * 5, v * 5, 5, 11, 4);
}
// patch layout (u around, v up the cone). Placed on the front and sides, kept clear of the back seam.
const PATCHES = [
  { u: .74, v: .2, s: 1.0, moon: false, rot: .2 }, { u: .9, v: .33, s: .7, moon: false, rot: -.3 },
  { u: .62, v: .4, s: .62, moon: false, rot: .5 }, { u: .82, v: .52, s: .5, moon: false, rot: 0 },
  { u: .52, v: .24, s: .78, moon: true, rot: 0 }, { u: .02, v: .22, s: .66, moon: false, rot: .4 },
  { u: .45, v: .55, s: .42, moon: false, rot: -.2 }];
function patchLayer(ctx, mode) {      // mode: 'color' | 'height' | 'rough'
  PATCHES.forEach((p, k) => {
    const squeeze = 1 / Math.max(.25, 1 - p.v), R = 46 * p.s * (1 - p.v * .4);
    const col = CONFIG.patchColors[k % CONFIG.patchColors.length];
    for (const dx of [-LW, 0, LW]) {
      ctx.save(); ctx.translate(p.u * LW + dx, (1 - p.v) * LW); ctx.scale(squeeze, 1); ctx.rotate(p.rot);
      const path = () => { if (p.moon) { ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.arc(R * .45, -R * .28, R * .82, 0, 7, true); } else starPath(ctx, 0, 0, R, 0); };
      if (mode === 'color') {
        const c = new T.Color(col); c.lerp(new T.Color('#6f6c82'), .38); c.multiplyScalar(.66);      // faded, dusty felt
        path(); ctx.fillStyle = '#' + c.getHexString(); ctx.fill('evenodd');
        ctx.save(); ctx.clip('evenodd');                                        // soft inner wear
        const g = ctx.createRadialGradient(-R * .2, -R * .3, R * .1, 0, 0, R * 1.1);
        g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(0,0,0,.18)'); ctx.fillStyle = g; ctx.fillRect(-R * 2, -R * 2, R * 4, R * 4);
        ctx.restore();
        ctx.setLineDash([5, 5]); ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(30,20,50,.55)';   // hand stitching
        ctx.save(); ctx.scale(.86, .86); path(); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
      } else if (mode === 'height') {
        ctx.filter = 'blur(2.5px)'; path(); ctx.fillStyle = '#fff'; ctx.fill('evenodd'); ctx.filter = 'none';
        ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.save(); ctx.scale(.86, .86); path(); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
      } else { path(); ctx.fillStyle = 'rgb(225,225,225)'; ctx.fill('evenodd'); }
      ctx.restore();
    }
  });
}
const SEAM_U = .25;                    // back of the hat
function seamLayer(ctx, mode) {
  const x = SEAM_U * LW;
  if (mode === 'height') { const g = ctx.createLinearGradient(x - 6, 0, x + 6, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,.9)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - 6, 0, 12, LW); }
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  for (const s of [-5, 5]) { ctx.strokeStyle = mode === 'color' ? 'rgba(20,10,40,.45)' : '#000'; ctx.beginPath(); ctx.moveTo(x + s, 0); ctx.lineTo(x + s, LW); ctx.stroke(); }
  ctx.setLineDash([]);
}
function leatherColor(hex) {
  const cv = document.createElement('canvas'); cv.width = cv.height = LW; const c = cv.getContext('2d');
  const img = c.createImageData(LW, LW), d = img.data;
  const base = new T.Color(hex), lum = base.r * .3 + base.g * .59 + base.b * .11;
  base.lerp(new T.Color(lum, lum, lum), .12);
  const R = base.r * 255, G = base.g * 255, B = base.b * 255;
  for (let i = 0; i < LW * LW; i++) {
    const k = .52 + (coneMottle[i] - .5) * .13 + (coneGrain[i] - .5) * .03;
    d[i * 4] = Math.min(255, R * k); d[i * 4 + 1] = Math.min(255, G * k); d[i * 4 + 2] = Math.min(255, B * k); d[i * 4 + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  seamLayer(c, 'color'); patchLayer(c, 'color');
  return canvasTex(cv, true);
}
function leatherNormal() {
  const hc = document.createElement('canvas'); hc.width = hc.height = LW; const c = hc.getContext('2d');
  c.fillStyle = '#808080'; c.fillRect(0, 0, LW, LW); seamLayer(c, 'height'); patchLayer(c, 'height');
  const extra = c.getImageData(0, 0, LW, LW).data;
  const h = new Float32Array(LW * LW);
  for (let i = 0; i < LW * LW; i++) h[i] = coneGrain[i] * .55 + coneMottle[i] * .6 + (extra[i * 4] / 255 - .5) * 1.1;
  return canvasTex(heightToNormal(h, LW, LW, 3), false);
}
function leatherRough() {
  const cv = document.createElement('canvas'); cv.width = cv.height = LW; const c = cv.getContext('2d');
  const img = c.createImageData(LW, LW), d = img.data;
  for (let i = 0; i < LW * LW; i++) { const r = (.6 + coneMottle[i] * .2 + (coneGrain[i] - .5) * .08) * 255; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = r; d[i * 4 + 3] = 255; }
  c.putImageData(img, 0, 0); patchLayer(c, 'rough');
  return canvasTex(cv, false);
}
// plain leather for the brim (tiles around)
function plainLeather(hex) {
  const W = 512, H = 128, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  const img = c.createImageData(W, H), d = img.data, nh = new Float32Array(W * H);
  const base = new T.Color(hex), lum = base.r * .3 + base.g * .59 + base.b * .11; base.lerp(new T.Color(lum, lum, lum), .12);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, g = fbm(x / W * 80, y / H * 20, 80, 21, 3), m = fbm(x / W * 6, y / H * 2, 6, 29, 3);
    nh[i] = g * .55 + m * .5; const k = .52 + (m - .5) * .12 + (g - .5) * .03;
    d[i * 4] = Math.min(255, base.r * 255 * k); d[i * 4 + 1] = Math.min(255, base.g * 255 * k); d[i * 4 + 2] = Math.min(255, base.b * 255 * k); d[i * 4 + 3] = 255;
  }

  c.setLineDash([7, 6]); c.lineWidth = 2; c.strokeStyle = 'rgba(20,10,40,.45)'; c.beginPath(); c.moveTo(0, (1 - .44) * H); c.lineTo(W, (1 - .44) * H); c.stroke();

}
// grosgrain ribbon for the band
function grosgrain(hex) {
  const W = 1024, H = 64, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  const img = c.createImageData(W, H), d = img.data, nh = new Float32Array(W * H);
  const base = new T.Color(hex).multiplyScalar(.7);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, rib = .5 + .5 * Math.sin(x / W * Math.PI * 2 * 360), m = fbm(x / W * 12, y / H, 12, 41, 2);
    nh[i] = rib * .6 + m * .3; const k = .88 + rib * .1 + (m - .5) * .1;
    d[i * 4] = Math.min(255, base.r * 255 * k); d[i * 4 + 1] = Math.min(255, base.g * 255 * k); d[i * 4 + 2] = Math.min(255, base.b * 255 * k); d[i * 4 + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  return { map: canvasTex(cv, true), normal: canvasTex(heightToNormal(nh, W, H, 2), false) };
}

/* =====================================================================
   MATERIALS
   ===================================================================== */
const coneNormal = leatherNormal(), coneRough = leatherRough();

/* =====================================================================

const motion = { pPrev: null, qPrev: null, vel: v3(), acc: v3(), w: v3(), alpha: v3() };   // smoothed head motion (head space)
const headUp = () => v3(0, 1, 0).applyQuaternion(headQuat);
const bendLocal = () => v3(CONFIG.droopSide * .85, 0, -.55).normalize();
const bendDir = () => bendLocal().applyQuaternion(hatQuat);

  const d = dims(), b = bendLocal(), out = [v3()]; let dir = v3(0, 1, 0), p = v3();
  for (let i = 1; i < N; i++) { dir = rotTowards(dir, b, restBend(i)); p = p.clone().addScaledVector(dir, d.seg); out.push(p); }

}

// measure the head's motion each frame (smoothed so camera noise can't make the hat twitch)
function measureMotion(dt) {
  if (!dt) return;
  const inv = headQuat.clone().invert();
  if (motion.pPrev) {
    const v = anchor.clone().sub(motion.pPrev).divideScalar(dt);
    const a = v.clone().sub(motion.vel).divideScalar(dt);
    motion.vel.lerp(v, .35); motion.acc.lerp(a.applyQuaternion(inv), .18);
    const dq = headQuat.clone().multiply(motion.qPrev.clone().invert());
    if (dq.w < 0) { dq.x *= -1; dq.y *= -1; dq.z *= -1; dq.w *= -1; }
    const ang = 2 * Math.acos(Math.min(1, dq.w)), sn = Math.sqrt(Math.max(1e-9, 1 - dq.w * dq.w));
    const w = v3(dq.x / sn, dq.y / sn, dq.z / sn).multiplyScalar(ang / dt).applyQuaternion(inv);
    const al = w.clone().sub(motion.w).divideScalar(dt);

function stepPhysics(dt) {
  const wt = CONFIG.weight, flop = CONFIG.floppiness;
  const w1 = 5.2 / Math.sqrt(wt) * (1.15 - .15 * flop), z1 = .55 + .12 * wt;     // whole-hat sway: slow, well damped
  const w2 = 8.5 / Math.sqrt(wt) * (1.15 - .15 * flop), z2 = .45 + .1 * wt;      // tip: a little quicker, follows behind
  const gain = .0045 * flop, d = dims();
  // forces in head space (x = right, z = forward)
  const gL = v3(0, -981 * CONFIG.gravity, 0).applyQuaternion(headQuat.clone().invert());
  const tipR = restLocal()[N - 1];
  const tang = v3().crossVectors(motion.alpha, tipR);                // turning makes the tip lag behind
  const fx = (-motion.acc.x - tang.x * .45 + gL.x * .9) * gain, fz = (-motion.acc.z - tang.z * .45 + gL.z * .9) * gain;
  const lim = .26;
  for (const [M, w, z, k] of [[M1, w1, z1, 1], [M2, w2, z2, .8]]) {
    const ax = -w * w * M.x - 2 * z * w * M.vx + fx * w * w * k, az = -w * w * M.z - 2 * z * w * M.vz + fz * w * w * k;
    M.vx += ax * dt; M.vz += az * dt; M.x += M.vx * dt; M.z += M.vz * dt;
    M.x = Math.max(-lim, Math.min(lim, M.x)); M.z = Math.max(-lim, Math.min(lim, M.z));

    const sx = M1.x * flex * Math.pow(t, 1.1) + M2.x * Math.pow(t, 3), sz = M1.z * flex * Math.pow(t, 1.1) + M2.z * Math.pow(t, 3);

    camera.position.set(Math.sin(ang) * demo.camDist, 13, Math.cos(ang) * demo.camDist); camera.lookAt(0, 5, 0);
    plane.normal.set(Math.sin(ang), 0, Math.cos(ang)); demoPose(dt, t, now);
  } else trackPose(now);
  const want = hatOn && poseOk && now - lastSeen < 600;
  if (want !== shown) {
    shown = want; showT = 0;
    if (pendingPoof || want) { if (poseOk) poof(); hideMode = 'poof'; } else hideMode = 'quiet';
    pendingPoof = false;
  } else if (pendingPoof && !want && !hatOn) pendingPoof = false;
  showT += dt;
  appear = Math.max(0, appearScale(showT, shown));
  hatRoot.visible = poseOk && appear > .01;
  if (poseOk) {
    measureMotion(dt);
    const tipBefore = charm.tipPrev ? charm.tipPrev.clone() : null;
    acc = Math.min(acc + dt, .1); let steps = 0; while (acc >= STEP) { stepPhysics(STEP); acc -= STEP; steps++; }
    buildSpine();
    const tipNow = pts[N - 1].clone(), from = tipBefore || tipNow;
    const tipVel = dt > 0 ? tipNow.clone().sub(from).divideScalar(dt) : v3();
    for (let s = 1; s <= steps; s++) stepCharm(STEP, from.clone().lerp(tipNow, s / steps), tipVel);
    charm.tipPrev = tipNow;
    hatRoot.position.copy(anchor); hatRoot.scale.setScalar(Math.max(.001, appear));
    updateMeshes(t);
  }
  updateSparkles(dt, t); updatePuffs(dt); placeLights(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

if (DEMO) {
  const $ = id => document.getElementById(id);
  $('bShake').onclick = () => { demo.action = 'shake'; demo.actionT = 0; demo.idle = 0; };
  $('bNod').onclick = () => { demo.action = 'nod'; demo.actionT = 0; demo.idle = 0; };
  $('bLook').onclick = () => { demo.action = 'look'; demo.actionT = 0; demo.idle = 0; };
  $('bPoof').onclick = () => toggleHat();
  $('bMore').onclick = () => { const p = $('panel'); p.classList.toggle('open'); $('bMore').setAttribute('aria-expanded', p.classList.contains('open')); };
  const bind = (id, fn) => $(id).addEventListener('input', e => fn(+e.target.value));
  bind('sView', v => demo.view = v); bind('sFlop', v => CONFIG.floppiness = v); bind('sDroop', v => CONFIG.droop = v);
  bind('sHeight', v => CONFIG.hatHeight = v); bind('sWeight', v => CONFIG.weight = v);
  const tog = (id, k) => $(id).onclick = () => { CONFIG[k] = !CONFIG[k]; $(id).classList.toggle('on', CONFIG[k]); };
  tog('bCharm', 'charm'); tog('bSpark', 'sparkles');
  document.querySelectorAll('.sw').forEach(b => b.onclick = () => { document.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); b.classList.add('on'); setHatColor(b.dataset.c); });
  $('loading').remove();
} else startTracking();

window.__hat = { demo, CONFIG, get ok() { return poseOk; } };
requestAnimationFrame(frame);
})();
</script>
</body>
