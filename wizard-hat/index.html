<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wizard hat</title>
<script>
/* =====================================================================
   CONFIG: edit these
   ===================================================================== */
const CONFIG = {
  // ---- face tracking (OBS overlay) ----
  cameraName: "OBS Virtual Camera",   // part of the camera's name is enough
  mirror: false,                      // true if you flipped your camera horizontally in OBS
  camRect: { x: 0, y: 0, w: 1920, h: 1080 },   // where your camera sits on the 1920x1080 canvas
  smoothing: 0.35,                    // 0..0.9, higher = steadier but laggier
  sitHeight: 0,                       // nudge the hat up (+) or down (-), in cm
  sitDepth: -1,                        // nudge the hat back (-) or forward (+), in cm
  fitSize: 1.0,                       // fine-tune the auto size (1 = matched to your face)
  hideBrimBehindHead: false,          // true = an invisible head shape hides the brim behind your head (can cut the hat if the fit is off)

  // ---- look (GACA palette) ----
  hatColor: "#512EAB",                // Amethyst
  bandColor: "#56E2E1",               // Turquoise
  patchColors: ["#FFCE00", "#DF41CF", "#56E2E1", "#C1BFFF"],   // Amber, Fuchsia, Turquoise, Light Purple
  hatScale: 1.0,
  hatHeight: 1.3,
  brimSize: 1.5,                      // width of the brim only (the crown stays the same): 0.7 = narrow, 1.5 = extra wide. In OBS you can also add &brim=1.3 to the URL
  droop: 1.3,                         // how far the tip bends over (0 = straight up)
  droopSide: -1,                      // -1 = tip falls to the hat's left, 1 = right
  charm: true,                        // little brass star hanging from the tip
  sparkles: true,                     // a few drifting sparkles

  // ---- on / off ----
  startOn: true,                      // hat appears (in a puff of smoke) as soon as it finds your face
  blinkToggle: 3,                     // blink this many times quickly to poof the hat on/off (0 = off)
  blinkWindow: 1.3,                   // ...within this many seconds

  // ---- air pen: pinch to draw, wave to erase ----
  airPen: false,                      // the air pen now lives in its own overlay (air-pen/index.html)
  inkColors: ["#56E2E1", "#DF41CF", "#FFCE00"],   // thumb+index, thumb+middle, thumb+ring (Turquoise, Fuchsia, Amber)
  inkWidth: 7,                        // line thickness at 1080p
  inkGlow: 1.0,                       // 0 = flat ink, 1 = soft neon glow
  penCursor: true,                    // small ring at your fingertip so you can aim
  pinchStart: 0.30,                   // how close fingertips must be to start drawing (lower = tighter pinch)
  waveErase: 3,                       // back-and-forth swings needed to erase (within ~1 second)

  // ---- phoenix familiar (lives in the same 3D scene as the hat) ----
  phoenix: true,
  phoenixStyle: "pixel",             // "pixel" = GACA pixel art (lives in the hat's 3D scene), "3d" = the built-in 3D bird
  phoenixPixelSize: 3,                // screen pixels per art pixel at 1080p (bigger = chunkier, smaller = more detail)
  phoenixShoulder: "left",            // which of YOUR shoulders it perches on: "left" or "right"
  phoenixSize: 1.0,
  phoenixStartVisible: false,         // hidden until you snap your fingers
  phoenixAutoFly: true,               // takes off by itself now and then
  phoenixPerchSeconds: [25, 50],
  phoenixFlightSeconds: [10, 18],
  phoenixHatPerch: 0.35,              // chance it lands on the hat brim instead of your shoulder
  // artist-made 3D bird (recommended for realism): put the .glb next to this file and name it here, e.g. "phoenix.glb"
  phoenixModel: "",
  phoenixModelForward: "+z",          // which way the model's beak points in the file: "+z", "-z", "+x" or "-x"
  phoenixModelSize: 1.0,              // fine-tune its size
  phoenixTint: 0.85,                  // 0 = the model's own colors, 1 = fully remapped to GACA colors (keeps its texture detail)
  phoenixExtraPlumes: true,           // add the long GACA tail plumes to the model
  phoenixHeadLook: true,              // quick bird-like head turns on top of its idle animation
  phoenixClips: {},                   // optional: { fly: "ClipName", idle: "ClipName", glide: "...", land: "..." }
  snapSound: true,                    // also listen for the snap's "click" (uses your default mic)
  snapLoudness: 1.0,                  // raise if snaps are missed, lower if other sounds trigger it

  // ---- eyebrow raise: the hat stands up tall until your brows come down ----
  browStand: true,
  browThreshold: 0.22,                // how far above your resting brows counts as "raised" (lower = more sensitive)
  standHeight: 1.15,                  // how much taller it stretches when standing (1 = no stretch)

  // ---- physics ----
  floppiness: 0.8,
  weight: 1.0,                        // heavier = slower and calmer
  gravity: 1.0
};
const FORCE_DEMO = false;
</script>

  @media (min-width: 760px) { #panel { left: auto; right: 20px; bottom: 20px; width: 360px; margin: 0; } }
  .btns { display: flex; gap: 8px; }

<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="pen"></canvas>
<div id="status">Starting…</div>

<div id="ui">
  <div id="loading">Stitching the hat…</div>
  <header>
    <h1>Wizard hat</h1>
    <p>Snap to summon the phoenix. Drag the head to see it keep its balance.</p>
  </header>
  <div id="panel">
    <div class="btns">
      <button class="act" id="bShake">Shake</button>
      <button class="act" id="bNod">Nod</button>
      <button class="act" id="bLook">Look</button>
      <button class="act" id="bPoof">Poof</button>
      <button id="bMore" aria-expanded="false">Adjust</button>
    </div>
    <div class="btns" style="margin-top:8px">
      <button class="act" id="bSnap">Snap 🔥</button>
      <button class="act" id="bPFly">Fly</button>
      <button class="act" id="bPHat">Land on hat</button>
    </div>
    <div id="more">
      <div class="swatches"><span>Hat color</span>
        <button class="sw on" data-c="#512EAB" style="background:#512EAB" aria-label="Amethyst"></button>
        <button class="sw" data-c="#0D004D" style="background:#0D004D" aria-label="Pearson Purple"></button>
        <button class="sw" data-c="#DF41CF" style="background:#DF41CF" aria-label="Fuchsia"></button>
        <button class="sw" data-c="#56E2E1" style="background:#56E2E1" aria-label="Turquoise"></button>
        <button class="sw" data-c="#C1BFFF" style="background:#C1BFFF" aria-label="Light Purple"></button>
      </div>
      <div class="row"><label for="sView">Camera angle</label><input id="sView" type="range" min="-80" max="80" step="1" value="0"></div>
      <div class="row"><label for="sFlop">Floppiness</label><input id="sFlop" type="range" min="0.2" max="3" step="0.05" value="0.8"></div>
      <div class="row"><label for="sDroop">Droop</label><input id="sDroop" type="range" min="0" max="2.2" step="0.05" value="1"></div>
      <div class="row"><label for="sHeight">Height</label><input id="sHeight" type="range" min="0.6" max="1.6" step="0.05" value="1"></div>
      <div class="row"><label for="sBrim">Brim size</label><input id="sBrim" type="range" min="0.7" max="1.8" step="0.05" value="1"></div>
      <div class="row"><label for="sWeight">Weight</label><input id="sWeight" type="range" min="0.3" max="2.5" step="0.05" value="1"></div>

        <button id="bCharm" class="on">Charm</button>
        <button id="bSpark" class="on">Sparkles</button>
        <button id="bBrow">Brows up</button>

      </div>
    </div>
  </div>
</div>

<script>
(() => {
const params = new URLSearchParams(location.search);
const DEMO = FORCE_DEMO || params.has('demo');
const DEBUG = params.has('debug');
// ?layer=front  -> goes ABOVE your camera: outside of the hat, top of the brim, charm, sparkles, smoke
// ?layer=back   -> goes BELOW your camera: underside of the brim and inside of the hat (hidden behind you)
// no layer      -> the whole hat in one source
const LAYER = DEMO ? null : params.get('layer');
if (params.get('model')) CONFIG.phoenixModel = params.get('model');
if (params.get('fwd')) CONFIG.phoenixModelForward = params.get('fwd');
const IS_FRONT = LAYER === 'front', IS_BACK = LAYER === 'back';
const sync = ('BroadcastChannel' in window) ? new BroadcastChannel('wizard-hat-sync') : null;
let follow = null, lastMsg = -1e9;
if (IS_BACK && sync) sync.onmessage = e => { follow = e.data; lastMsg = performance.now(); };
if (DEMO) document.body.classList.add('demo');
if (DEBUG) document.body.classList.add('debug');
const statusEl = document.getElementById('status');
const setStatus = s => { statusEl.textContent = s; console.log('[hat]', s); };
const T = THREE, v3 = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const canvas = document.getElementById('gl'), video = document.getElementById('video');

/* =====================================================================
   RENDERER + STUDIO LIGHTING
   ===================================================================== */
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.VSMShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(DEMO ? 30 : 63, 16 / 9, 1, 10000);

// neutral softbox environment, so metals read as true brass and leather picks up soft highlights
(function makeEnv() {
  const s = new T.Scene(), box = new T.BoxGeometry(1, 1, 1);
  const panel = (hex, k, p, sc) => { const m = new T.Mesh(box, new T.MeshBasicMaterial({ color: new T.Color(hex).multiplyScalar(k) }));
    m.position.set(...p); m.scale.set(...sc); s.add(m); };
  s.background = new T.Color('#3a3850');
  panel('#ffffff', 9, [-5, 4, 5], [4, 4, .2]);      // big key softbox
  panel('#ffffff', 3, [6, 2, 3], [.2, 5, 5]);       // fill card
  panel('#ffffff', 5, [0, 9, 0], [8, .2, 8]);       // ceiling
  panel('#C1BFFF', 2, [0, 2, -8], [10, 4, .2]);     // light purple back wall
  panel('#2a2440', 1, [0, -6, 0], [20, .2, 20]);    // dark floor
  const pm = new T.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, .02).texture;
})();
const hemi = new T.HemisphereLight('#EDECF6', '#1a1440', .28); scene.add(hemi);
const key = new T.DirectionalLight('#fff4e8', 2.1); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 7; key.shadow.blurSamples = 16; key.shadow.bias = -.0006;
Object.assign(key.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 300 });
scene.add(key, key.target);
const fill = new T.DirectionalLight('#C1BFFF', .55); scene.add(fill, fill.target);          // Light Purple fill
const rimA = new T.DirectionalLight('#56E2E1', 1.0); scene.add(rimA, rimA.target);         // Turquoise rim
const rimB = new T.DirectionalLight('#DF41CF', .7); scene.add(rimB, rimB.target);          // Fuchsia rim

/* =====================================================================
   TEXTURES: quiet, physically plausible detail
   ===================================================================== */
const PERM = new Uint16Array(4096), VALS = new Float32Array(4096);
{ let sd = 9876; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 4096; i++) { PERM[i] = r() * 4096 | 0; VALS[i] = r(); } }
const hash = (i, j, s) => VALS[(PERM[(i + s * 131) & 4095] + j * 61 + s * 17) & 4095];
function vnoise(x, y, px, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, w = k => ((k % px) + px) % px;
  const a = hash(w(xi), yi, s), b = hash(w(xi + 1), yi, s), c = hash(w(xi), yi + 1, s), d = hash(w(xi + 1), yi + 1, s);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, px, s, oct) { let t = 0, a = .5, f = 1, n = 0; for (let o = 0; o < oct; o++) { t += vnoise(x * f, y * f, px * f, s + o * 7) * a; n += a; a *= .5; f *= 2; } return t / n; }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function canvasTex(cv, srgb) { const t = new T.CanvasTexture(cv); if (srgb) t.encoding = T.sRGBEncoding; t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = 8; return t; }
function heightToNormal(h, W, H, k) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = h[y * W + (x - 1 + W) % W], r = h[y * W + (x + 1) % W];
    const u = h[((y - 1 + H) % H) * W + x], dn = h[((y + 1) % H) * W + x];
    let nx = (l - r) * k, ny = (dn - u) * k; const nz = 1, L = Math.hypot(nx, ny, nz);
    d[i * 4] = (nx / L * .5 + .5) * 255; d[i * 4 + 1] = (ny / L * .5 + .5) * 255; d[i * 4 + 2] = (nz / L * .5 + .5) * 255; d[i * 4 + 3] = 255;
  }
  c.putImageData(img, 0, 0); return cv;
}
function starPath(c, x, y, R, rot, n = 5, inner = .42) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? R * inner : R, a = rot + i * Math.PI / n - Math.PI / 2; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  c.closePath();
}
function starShape(R, r) {
  const s = new T.Shape();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r : R, a = i * Math.PI / 5 + Math.PI / 2; i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  s.closePath(); return s;
}

// The leather: soft mottling + fine grain. Patches: a few sewn-on felt stars and a moon.
const LW = 768;
const coneGrain = new Float32Array(LW * LW), coneMottle = new Float32Array(LW * LW);
for (let y = 0; y < LW; y++) for (let x = 0; x < LW; x++) {
  const u = x / LW, v = y / LW, i = y * LW + x;
  coneGrain[i] = fbm(u * 110, v * 110, 110, 3, 3);
  coneMottle[i] = fbm(u * 5, v * 5, 5, 11, 4);
}
// patch layout (u around, v up the cone). Placed on the front and sides, kept clear of the back seam.
const PATCHES = [
  { u: .74, v: .2, s: 1.0, moon: false, rot: .2 }, { u: .9, v: .33, s: .7, moon: false, rot: -.3 },
  { u: .62, v: .4, s: .62, moon: false, rot: .5 }, { u: .82, v: .52, s: .5, moon: false, rot: 0 },
  { u: .52, v: .24, s: .78, moon: true, rot: 0 }, { u: .02, v: .22, s: .66, moon: false, rot: .4 },
  { u: .45, v: .55, s: .42, moon: false, rot: -.2 }];
function patchLayer(ctx, mode) {      // mode: 'color' | 'height' | 'rough'
  PATCHES.forEach((p, k) => {
    const squeeze = 1 / Math.max(.25, 1 - p.v), R = 46 * p.s * (1 - p.v * .4);
    const col = CONFIG.patchColors[k % CONFIG.patchColors.length];
    for (const dx of [-LW, 0, LW]) {
      ctx.save(); ctx.translate(p.u * LW + dx, (1 - p.v) * LW); ctx.scale(squeeze, 1); ctx.rotate(p.rot);
      const path = () => { if (p.moon) { ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.arc(R * .45, -R * .28, R * .82, 0, 7, true); } else starPath(ctx, 0, 0, R, 0); };
      if (mode === 'color') {
        const c = new T.Color(col); c.lerp(new T.Color('#6f6c82'), .38); c.multiplyScalar(.66);      // faded, dusty felt
        path(); ctx.fillStyle = '#' + c.getHexString(); ctx.fill('evenodd');
        ctx.save(); ctx.clip('evenodd');                                        // soft inner wear
        const g = ctx.createRadialGradient(-R * .2, -R * .3, R * .1, 0, 0, R * 1.1);
        g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(0,0,0,.18)'); ctx.fillStyle = g; ctx.fillRect(-R * 2, -R * 2, R * 4, R * 4);
        ctx.restore();
        ctx.setLineDash([5, 5]); ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(30,20,50,.55)';   // hand stitching
        ctx.save(); ctx.scale(.86, .86); path(); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
      } else if (mode === 'height') {
        ctx.filter = 'blur(2.5px)'; path(); ctx.fillStyle = '#fff'; ctx.fill('evenodd'); ctx.filter = 'none';
        ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.save(); ctx.scale(.86, .86); path(); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
      } else { path(); ctx.fillStyle = 'rgb(225,225,225)'; ctx.fill('evenodd'); }
      ctx.restore();
    }
  });
}
const SEAM_U = .25;                    // back of the hat
function seamLayer(ctx, mode) {
  const x = SEAM_U * LW;
  if (mode === 'height') { const g = ctx.createLinearGradient(x - 6, 0, x + 6, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,.9)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - 6, 0, 12, LW); }
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  for (const s of [-5, 5]) { ctx.strokeStyle = mode === 'color' ? 'rgba(20,10,40,.45)' : '#000'; ctx.beginPath(); ctx.moveTo(x + s, 0); ctx.lineTo(x + s, LW); ctx.stroke(); }
  ctx.setLineDash([]);
}
function leatherColor(hex) {
  const cv = document.createElement('canvas'); cv.width = cv.height = LW; const c = cv.getContext('2d');
  const img = c.createImageData(LW, LW), d = img.data;
  const base = new T.Color(hex), lum = base.r * .3 + base.g * .59 + base.b * .11;
  base.lerp(new T.Color(lum, lum, lum), .12);
  const R = base.r * 255, G = base.g * 255, B = base.b * 255;
  for (let i = 0; i < LW * LW; i++) {
    const k = .52 + (coneMottle[i] - .5) * .13 + (coneGrain[i] - .5) * .03;
    d[i * 4] = Math.min(255, R * k); d[i * 4 + 1] = Math.min(255, G * k); d[i * 4 + 2] = Math.min(255, B * k); d[i * 4 + 3] = 255;
  }

  }

      if (f.kind === 'flame') { const r = Math.max(1.5, f.w / texelCm * (.55 + .45 * Math.sin(k * Math.PI))); flamePath(c, q.x, q.y + r * .6, -Math.PI / 2 + Math.sin(f.age * 9 + f.wob) * .25, r * 2.2, r * 1.4);
        c.fillStyle = f.col; c.fill(); flamePath(c, q.x, q.y + r * .45, -Math.PI / 2, r * 1.2, r * .7); c.fillStyle = PC.at; c.fill(); }
      else { c.fillStyle = f.col; const sz = f.kind === 'spark' ? 2 : 1; c.fillRect(Math.round(q.x), Math.round(q.y), sz, sz); } }
    PXB.finish(c, N, N);
    PX.tex.needsUpdate = true;

    PX.mesh.position.copy(st.pos); if (st.mode === 'perch') PX.mesh.position.addScaledVector(camera.position.clone().sub(st.pos).normalize(), 12 * s);   // perched: sits just in front of your shoulder
    PX.mesh.quaternion.copy(camera.quaternion); PX.mesh.scale.setScalar(N * texelCm);
  }

  /* =========================== SYNC =========================== */
  const KEYS = ['visible', 'appear', 'mode', 'depth', 'pitch', 'roll', 'open', 'phase', 'flapAmp', 'crouch', 'preen', 'blink', 'dip', 'spot', 'flare', 'fan', 'glide', 'hy', 'hp', 'hr', 'breath', 'shuffle', 'ruffle'];
  function exportState() {
    const o = {}; KEYS.forEach(k => o[k] = st[k]);
    o.pos = st.pos.toArray(); o.fwd = st.fwd.toArray(); o.headW = st.headW ? st.headW.toArray() : null;
    o.plumes = plumes.map(p => p.p.map(v => [v.x, v.y, v.z])); o.shL = shoulderL && shoulderL.toArray(); o.shR = shoulderR && shoulderR.toArray(); return o;
  }

    st.pos.fromArray(o.pos); st.fwd.fromArray(o.fwd); st.headW = o.headW ? v3().fromArray(o.headW) : null;
    plumes.forEach((p, i) => { p.p = (o.plumes[i] || []).map(a => v3(a[0], a[1], a[2])); p.q = p.p.map(v => v.clone()); });
    shoulderL = o.shL ? v3().fromArray(o.shL) : null; shoulderR = o.shR ? v3().fromArray(o.shR) : null;
    const b = brimPerch().local.clone().setY(0).normalize(), ax = v3().crossVectors(UP, b).normalize(); brimQ.setFromAxisAngle(ax.lengthSq() ? ax : X1, st.dip * (st.visible ? st.appear : 0));
    pose(t, 0);
  }
  return { setHands: H => { hands = H; }, ON, update, toggle, takeOff, land, setShoulders: (L, R) => { shoulderL = L; shoulderR = R; }, exportState, importState, brimQ, st, hide: () => { group.visible = false; if (PX.mesh) PX.mesh.visible = false; plumes.forEach(p => p.m.visible = false); }, get shoulders() { return [shoulderL, shoulderR]; } };
})(); } catch (e) { console.warn('[phoenix] could not start; the hat runs without it.', e); phOK = false; return PH_STUB; } })();

/* ---------- snap detection: hand motion + the snap's "click" ---------- */
const SNAP = { hands: {}, lastClick: -1e9, lastSnap: -1e9, armedAt: -1e9, an: null, buf: null, avg: .002, handLm: null, poseLm: null };
function snapFired(now, why) { if (now - SNAP.lastSnap < 1200) return; SNAP.lastSnap = now; PH.toggle(); console.log('[phoenix] snap', why); }
function snapHands(res, now) {
  const lms = (res && res.landmarks) || [], vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  lms.forEach((lm, i) => {
    const P = j => ({ x: lm[j].x * vw, y: lm[j].y * vh }), d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const scale = d(P(0), P(9)) || 1, tm = d(P(4), P(12)) / scale;
    const palm = [0, 5, 9, 13, 17].reduce((a, j) => ({ x: a.x + P(j).x / 5, y: a.y + P(j).y / 5 }), { x: 0, y: 0 });
    const S = SNAP.hands[i] || (SNAP.hands[i] = { n: 0, prev: null });
    const mid = P(12), sp = S.prev ? d(mid, S.prev) / scale : 0; S.prev = mid;
    if (tm < .32) { S.n++; if (S.n >= 2) SNAP.armedAt = now; }
    else { if (S.n >= 2 && sp > .35 && d(mid, palm) / scale < .95) snapFired(now, 'motion'); S.n = 0; }
  });
  if (now - SNAP.lastClick < 300 && now - SNAP.armedAt < 650) snapFired(now, 'sound');
}
async function snapListen() {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
    const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(st).connect(an);
    SNAP.an = an; SNAP.buf = new Float32Array(an.fftSize); if (ac.state === 'suspended') ac.resume();
  } catch (e) { console.warn('[phoenix] no mic; snaps by hand motion only'); }
}
function snapAudio(now) {
  if (!SNAP.an) return; SNAP.an.getFloatTimeDomainData(SNAP.buf);
  let hf = 0; for (let i = 1; i < SNAP.buf.length; i++) hf = Math.max(hf, Math.abs(SNAP.buf[i] - SNAP.buf[i - 1]));
  if (hf > SNAP.avg * 7 / CONFIG.snapLoudness && hf > .05 / CONFIG.snapLoudness) SNAP.lastClick = now;
  SNAP.avg += (hf - SNAP.avg) * .02;
}

/* =====================================================================
   LAYOUT + LOOP
   ===================================================================== */
function layout() {
  if (DEMO) {
    const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height;
    penResize(Math.round(r.width * Math.min(2, devicePixelRatio || 1)), Math.round(r.height * Math.min(2, devicePixelRatio || 1)));
    const tanH = Math.tan(T.MathUtils.degToRad(camera.fov / 2));
    demo.camDist = Math.max(42 / tanH, 26 / (tanH * camera.aspect)); camera.updateProjectionMatrix();
  } else {
    const R = CONFIG.camRect, sx = innerWidth / 1920, sy = innerHeight / 1080;
    Object.assign(canvas.style, { left: R.x * sx + 'px', top: R.y * sy + 'px', width: R.w * sx + 'px', height: R.h * sy + 'px', transform: CONFIG.mirror ? 'scaleX(-1)' : 'none' });
    Object.assign(penCv.style, { left: canvas.style.left, top: canvas.style.top, width: canvas.style.width, height: canvas.style.height, transform: canvas.style.transform });
    penResize(Math.round(R.w), Math.round(R.h));
    renderer.setSize(R.w * sx, R.h * sy, false); camera.aspect = R.w / R.h; camera.position.set(0, 0, 0); camera.lookAt(0, 0, -1); camera.updateProjectionMatrix();
  }
}
addEventListener('resize', layout); layout();
function placeLights() {
  const c = poseOk ? headPos.clone().add(v3(0, 10, 0)) : v3();
  const view = DEMO ? camera.position.clone().sub(c).setY(0).normalize() : v3(0, 0, 1), right = v3().crossVectors(v3(0, 1, 0), view).normalize();
  key.position.copy(c).addScaledVector(view, 55).addScaledVector(right, -60).add(v3(0, 75, 0)); key.target.position.copy(c);
  fill.position.copy(c).addScaledVector(view, 40).addScaledVector(right, 70); fill.target.position.copy(c);
  rimA.position.copy(c).addScaledVector(view, -70).addScaledVector(right, 45).add(v3(0, 40, 0)); rimA.target.position.copy(c);
  rimB.position.copy(c).addScaledVector(view, -70).addScaledVector(right, -50).add(v3(0, 30, 0)); rimB.target.position.copy(c);
}
let last = performance.now(), acc = 0; const STEP = 1 / 240;
function frame(now) {
  requestAnimationFrame(frame);                      // always keep the loop alive, even if something below fails
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = Math.max(last, now);
  const t = now / 1000;
  if (IS_BACK && follow && now - lastMsg < 600) {
    const F = follow;
    anchor.fromArray(F.a); headQuat.fromArray(F.hq); hatQuat.fromArray(F.q); autoScale = F.s; appear = F.ap;
    if (pts.length !== N) pts = Array.from({ length: N }, () => v3());
    for (let i = 0; i < N; i++) pts[i].fromArray(F.p, i * 3);
    headPos.fromArray(F.hp); poseOk = true;
    hatRoot.visible = appear > .01; hatRoot.position.copy(anchor); hatRoot.scale.setScalar(Math.max(.001, appear));
    if (F.ca && F.c) { camera.aspect = F.c; camera.updateProjectionMatrix(); }
    if (F.bs && F.bs !== CONFIG.brimSize) { CONFIG.brimSize = F.bs; buildBrim(); }
    phSafe(() => PH.importState(F.ph, t)); updateMeshes(t); points.visible = false;
    placeLights(); renderer.render(scene, camera);
    return;
  }
  if (DEMO) {
    const ang = T.MathUtils.degToRad(demo.view);
    camera.position.set(Math.sin(ang) * demo.camDist, 13, Math.cos(ang) * demo.camDist); camera.lookAt(0, 5, 0);
    plane.normal.set(Math.sin(ang), 0, Math.cos(ang)); demoPose(dt, t, now);
  } else { try { trackPose(now); } catch (e) { if (!frame.warned) { frame.warned = true; console.warn('[hat] tracking hiccup (ignored):', e); } } }
  const want = hatOn && poseOk && now - lastSeen < 600;
  if (want !== shown) {
    shown = want; showT = 0;
    if (pendingPoof || want) { if (poseOk) poof(); hideMode = 'poof'; } else hideMode = 'quiet';
    pendingPoof = false;
  } else if (pendingPoof && !want && !hatOn) pendingPoof = false;
  showT += dt;
  appear = Math.max(0, appearScale(showT, shown));
  hatRoot.visible = poseOk && appear > .01;
  if (poseOk) {
    measureMotion(dt);
    const tipBefore = charm.tipPrev ? charm.tipPrev.clone() : null;
    acc = Math.min(acc + dt, .1); let steps = 0; while (acc >= STEP) { stepPhysics(STEP); acc -= STEP; steps++; }
    buildSpine();
    const tipNow = pts[N - 1].clone(), from = tipBefore || tipNow;
    const tipVel = dt > 0 ? tipNow.clone().sub(from).divideScalar(dt) : v3();
    for (let s = 1; s <= steps; s++) stepCharm(STEP, from.clone().lerp(tipNow, s / steps), tipVel);
    charm.tipPrev = tipNow;
    hatRoot.position.copy(anchor); hatRoot.scale.setScalar(Math.max(.001, appear));
    updateMeshes(t);
    if (DEMO && torso) { torso.updateMatrixWorld(true); phSafe(() => PH.setShoulders(torso.localToWorld(v3(11.5, -14.4, -1.2)), torso.localToWorld(v3(-11.5, -14.4, -1.2)))); }
    if (!DEMO) snapAudio(now);
    phSafe(() => PH.update(dt, t));
  }
  if (IS_BACK) { points.visible = false; puffs.forEach(p => p.sp.visible = false); } else { updateSparkles(dt, t); updatePuffs(dt); }
  placeLights(); renderer.render(scene, camera); penRender(dt);
  if (sync && !IS_BACK && !DEMO && poseOk) {
    const flat = new Float32Array(N * 3); pts.forEach((p, i) => p.toArray(flat, i * 3));
    try { sync.postMessage({ a: anchor.toArray(), hq: headQuat.toArray(), q: hatQuat.toArray(), hp: headPos.toArray(), s: autoScale, ap: appear, p: Array.from(flat), c: camera.aspect, ca: 1, bs: CONFIG.brimSize, ph: phOK ? phSafe(() => PH.exportState()) : null }); } catch (e) {}
  }
}

if (DEMO) {
  const $ = id => document.getElementById(id);
  $('bShake').onclick = () => { demo.action = 'shake'; demo.actionT = 0; demo.idle = 0; };
  $('bNod').onclick = () => { demo.action = 'nod'; demo.actionT = 0; demo.idle = 0; };
  $('bLook').onclick = () => { demo.action = 'look'; demo.actionT = 0; demo.idle = 0; };
  $('bPoof').onclick = () => toggleHat();
  $('bSnap').onclick = () => PH.toggle();
  $('bPFly').onclick = () => { if (!PH.st.visible) PH.toggle(); else PH.takeOff(); };
  $('bPHat').onclick = () => { if (!PH.st.visible) PH.toggle(); PH.land('brim'); };
  $('bMore').onclick = () => { const p = $('panel'); p.classList.toggle('open'); $('bMore').setAttribute('aria-expanded', p.classList.contains('open')); };
  const bind = (id, fn) => $(id).addEventListener('input', e => fn(+e.target.value));
  bind('sView', v => demo.view = v); bind('sFlop', v => CONFIG.floppiness = v); bind('sDroop', v => CONFIG.droop = v);
  bind('sHeight', v => CONFIG.hatHeight = v); bind('sBrim', v => { CONFIG.brimSize = v; buildBrim(); }); bind('sWeight', v => CONFIG.weight = v);
  const tog = (id, k) => $(id).onclick = () => { CONFIG[k] = !CONFIG[k]; $(id).classList.toggle('on', CONFIG[k]); };
  tog('bCharm', 'charm'); tog('bSpark', 'sparkles');
  $('bBrow').onclick = () => { stand.target = stand.target ? 0 : 1; $('bBrow').classList.toggle('on', !!stand.target); $('bBrow').textContent = stand.target ? 'Brows down' : 'Brows up'; };
  document.querySelectorAll('.sw').forEach(b => b.onclick = () => { document.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); b.classList.add('on'); setHatColor(b.dataset.c); });
  $('loading').remove();
} else if (IS_BACK) {
  setTimeout(() => { if (performance.now() - lastMsg > 2500) { console.warn('[hat] no front layer heard; tracking on my own'); startTracking(); } else setStatus('Back layer: following the front layer'); }, 3000);
} else startTracking();

window.__ph = PH;
window.__hat = { demo, CONFIG, get ok() { return poseOk; } };
requestAnimationFrame(frame);
})();
